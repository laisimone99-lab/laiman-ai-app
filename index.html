<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laiman AI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14213d">
<style>
:root{--bg:#f6f4ef;--fg:#14213d;--card:#e7e3d9;--me:#14213d;--mt:#fff;--ac:#c8553d}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--fg:#e8e6df;--card:#1b2540;--me:#c8553d;--mt:#fff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,'Times New Roman',serif;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;border-bottom:1px solid #8883}
header img{width:40px;height:40px;border-radius:10px;background:#fff}
h1{margin:0;font-size:20px;font-weight:600}
#st{font:12px system-ui,sans-serif;opacity:.7;margin-top:2px}
#log{flex:1;overflow-y:auto;padding:10px 12px}
.m{max-width:88%;margin:8px 0;padding:10px 13px;border-radius:14px;white-space:pre-wrap;background:var(--card)}
.u{margin-left:auto;background:var(--me);color:var(--mt)}
form{display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0))}
input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid #8885;background:var(--card);color:var(--fg);font:inherit}
button{padding:0 18px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 15px system-ui,sans-serif}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><div><h1>Laiman AI</h1><div id="st">Avvio…</div></div></header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Scrivi un messaggio" autocomplete="off" disabled><button id="b" disabled>Invia</button></form>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.79";

const MODEL = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
const SYS = "Sei un assistente privato, curato, preciso e coerente. Rispondi sempre in italiano chiaro, con frasi complete e ben organizzate, senza ripetizioni. Se ti vengono date FONTI, basa la risposta su quelle e cita il titolo. Se non sei sicuro o non hai fonti pertinenti, dillo apertamente invece di inventare. Mantieni coerenza con tutta la conversazione.";
const $ = s => document.querySelector(s);
const log = $("#log"), st = $("#st"), q = $("#q"), b = $("#b");
let engine, news = [], updated = "", hist = [];

const add = (t, c) => {
  const d = document.createElement("div");
  d.className = "m " + c; d.textContent = t;
  log.append(d); log.scrollTop = log.scrollHeight; return d;
};

async function sync() {
  try {
    const r = await fetch("news.json?t=" + Date.now());
    localStorage.setItem("news", JSON.stringify(await r.json()));
  } catch (e) {}
  try {
    const j = JSON.parse(localStorage.getItem("news"));
    news = j.items || []; updated = j.updated || "";
  } catch (e) { news = []; }
}

const tok = s => s.toLowerCase().match(/\p{L}{3,}/gu) || [];
function find(text) {
  const w = new Set(tok(text));
  return news
    .map(n => ({ n, s: tok(n.title + " " + n.summary).filter(x => w.has(x)).length }))
    .filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 4).map(x => x.n);
}

async function send(text) {
  const src = find(text);
  const ctx = src.length
    ? "FONTI (aggiornate al " + updated + "):\n" + src.map(n => "- " + n.title + " (" + n.date + "): " + n.summary).join("\n")
    : "Nessuna fonte locale pertinente.";
  const msgs = [{ role: "system", content: SYS + "\n\n" + ctx }, ...hist.slice(-8), { role: "user", content: text }];
  const out = add("…", "b"); let t = "";
  const s = await engine.chat.completions.create({ messages: msgs, stream: true, temperature: 0.4, max_tokens: 1024 });
  for await (const c of s) {
    t += c.choices[0]?.delta?.content || "";
    out.textContent = t; log.scrollTop = log.scrollHeight;
  }
  hist.push({ role: "user", content: text }, { role: "assistant", content: t });
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ""; q.disabled = b.disabled = true;
  add(text, "u");
  try { await send(text); } catch (err) { add("Errore: " + err.message, "b"); }
  q.disabled = b.disabled = false; q.focus();
});

(async () => {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  navigator.storage?.persist?.();
  await sync();
  if (!navigator.gpu) {
    st.textContent = "WebGPU non disponibile";
    add("Questo browser non supporta WebGPU. Usa Chrome aggiornato su Android 12 o successivo.", "b");
    return;
  }
  try {
    engine = await webllm.CreateMLCEngine(MODEL, {
      initProgressCallback: p => st.textContent = p.text.slice(0, 70)
    });
    st.textContent = "Pronto · funziona offline · fonti: " + news.length + (updated ? " · agg. " + updated : "");
    add("Ciao! Sono il tuo agente privato. Tutto gira sul tuo telefono.", "b");
    q.disabled = b.disabled = false;
  } catch (err) {
    st.textContent = "Errore di caricamento";
    add("Impossibile caricare il modello: " + err.message, "b");
  }
})();
</script>
</body>
</html>
